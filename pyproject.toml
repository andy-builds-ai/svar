[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "andur"
version = "0.1.0"
description = "Svar, a chatbot that answers questions from a company's own documents, and Vard, an agent. Both are parts of a larger system called Andur."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
# Not a package for an index: PyPI refuses an upload that carries this classifier.
classifiers = ["Private :: Do Not Upload"]
# The ranges say what the code needs; constraints.txt pins the exact versions it is tested on.
dependencies = [
    # From 2.273.0 the CloudFront origin grants lambda:InvokeFunction itself, which the stack
    # test counts.
    "aws-cdk-lib>=2.273.0",
    "constructs>=10.0.0,<11.0.0",
    # Used by scripts/ only, and imported lazily there.
    # The crt extra is what lets botocore read the credentials `aws login`
    # writes (login_session profiles); without it the scripts cannot sign in.
    "boto3[crt]>=1.43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Pinned: the formatter's output changes between releases, and CI must
    # format exactly like the machine the code was written on.
    "ruff==0.16.8",
]

[tool.setuptools]
packages = ["infra", "infra.stacks"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
combine-as-imports = true
