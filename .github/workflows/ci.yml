name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 19.10.2026.
    runs-on: ubuntu-24.04
    steps:
      # Each action at a commit, not a tag: a tag can be moved to other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The runtime the function has in Lambda: LAMBDA_RUNTIME in infra/stacks/shared.py.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: constraints.txt

      # The CDK tests synthesize the stack through jsii, which runs on Node;
      # the markdown tests run web/markdown.js in Node too, and so does the CDK CLI below.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - run: pip install -e ".[dev]" -c constraints.txt
      - run: ruff check
      - run: ruff format --check
      - run: pytest -q

      # Both regions build from the same code, with the CLI version the README names.
      # `synth` calls nothing in AWS.
      - run: npx --yes aws-cdk@2.1142.0 synth --quiet --no-notices
      - run: npx --yes aws-cdk@2.1142.0 synth --quiet --no-notices -c region=eu-central-1
